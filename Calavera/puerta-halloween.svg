<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b4d"/>
      <stop offset="1" stop-color="#5b3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect width="480" height="360" fill="url(#sky)"/>
  <g fill="#fff4c9">
    <circle cx="30" cy="30" r="1.6"/><circle cx="90" cy="18" r="1.2"/><circle cx="140" cy="44" r="1.5"/>
    <circle cx="350" cy="22" r="1.3"/><circle cx="455" cy="60" r="1.6"/><circle cx="60" cy="80" r="1.1"/>
    <circle cx="420" cy="100" r="1.2"/>
  </g>
  <!-- Luna -->
  <circle cx="410" cy="48" r="28" fill="#fff1b8" stroke="#e8cf75" stroke-width="2"/>
  <circle cx="400" cy="42" r="5" fill="#f1dc8c"/><circle cx="420" cy="58" r="3.5" fill="#f1dc8c"/>
  <!-- Murciélago -->
  <path d="M60 52 q8 -10 16 -2 q4 -6 8 0 q8 -8 16 2 q-10 -2 -12 6 q-4 -4 -8 0 q-2 -8 -20 -6z" fill="#1d1233"/>

  <!-- Fachada -->
  <rect x="70" y="70" width="340" height="250" fill="#c98a5a" stroke="#7a4a2a" stroke-width="3"/>
  <g stroke="#b2774b" stroke-width="2" fill="none">
    <path d="M70 110 H410 M70 150 H410 M70 190 H410 M70 230 H410 M70 270 H410"/>
  </g>
  <!-- Tejadillo -->
  <path d="M150 92 L240 50 L330 92 Z" fill="#8e3b2e" stroke="#5c2219" stroke-width="3" stroke-linejoin="round"/>
  <rect x="150" y="88" width="180" height="10" rx="3" fill="#6e2c22" stroke="#5c2219" stroke-width="2"/>

  <!-- Ventanas -->
  <g stroke="#5a3a20" stroke-width="3">
    <rect x="92" y="130" width="64" height="74" rx="4" fill="#ffd76a"/>
    <rect x="324" y="130" width="64" height="74" rx="4" fill="#ffd76a"/>
    <path d="M124 130 V204 M92 167 H156 M356 130 V204 M324 167 H388" fill="none"/>
  </g>
  <!-- Fantasma en la ventana -->
  <path d="M338 196 v-26 a14 14 0 0 1 28 0 v26 l-5 -5 l-4 5 l-5 -5 l-5 5 l-4 -5 z" fill="#ffffff" stroke="#c9c9d6" stroke-width="1.5"/>
  <circle cx="347" cy="174" r="2.3" fill="#2a1b4d"/><circle cx="357" cy="174" r="2.3" fill="#2a1b4d"/>
  <ellipse cx="352" cy="183" rx="2.6" ry="3.4" fill="#2a1b4d"/>
  <!-- Telaraña -->
  <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="1" fill="none">
    <path d="M410 70 L380 70 M410 70 L410 100 M410 70 L386 94"/>
    <path d="M398 70 q2 6 12 8 M390 70 q4 12 20 18 M400 80 q4 4 10 4"/>
  </g>

  <!-- Farol -->
  <circle cx="196" cy="140" r="26" fill="url(#glow)"/>
  <rect x="189" y="128" width="14" height="22" rx="3" fill="#ffd76a" stroke="#3a2a1a" stroke-width="2.5"/>
  <path d="M187 128 h18 l-4 -6 h-10 z" fill="#3a2a1a"/>

  <!-- Marco y puerta -->
  <rect x="204" y="118" width="72" height="182" rx="6" fill="#6e2c22" stroke="#4a1c15" stroke-width="3"/>
  <path d="M212 296 V150 a28 28 0 0 1 56 0 V296 Z" fill="#7b4fb0" stroke="#3e2266" stroke-width="3"/>
  <g fill="#8f63c4" stroke="#3e2266" stroke-width="2">
    <rect x="220" y="160" width="17" height="52" rx="3"/>
    <rect x="243" y="160" width="17" height="52" rx="3"/>
    <rect x="220" y="226" width="17" height="56" rx="3"/>
    <rect x="243" y="226" width="17" height="56" rx="3"/>
  </g>
  <!-- Ventanita en arco -->
  <path d="M224 150 a16 16 0 0 1 32 0 Z" fill="#ffd76a" stroke="#3e2266" stroke-width="2"/>
  <!-- Pomo y aldaba -->
  <circle cx="261" cy="222" r="4.5" fill="#f2c14e" stroke="#8a6414" stroke-width="1.5"/>
  <circle cx="240" cy="198" r="7" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <!-- Timbre -->
  <circle cx="288" cy="212" r="5" fill="#f2c14e" stroke="#4a1c15" stroke-width="2"/>

  <!-- Suelo y escalones -->
  <rect x="0" y="320" width="480" height="40" fill="#4a7a3a"/>
  <path d="M0 320 H480" stroke="#335a28" stroke-width="3"/>
  <rect x="190" y="298" width="100" height="12" rx="3" fill="#9a9a9a" stroke="#5e5e5e" stroke-width="2"/>
  <rect x="176" y="309" width="128" height="14" rx="3" fill="#b4b4b4" stroke="#5e5e5e" stroke-width="2"/>
  <!-- Felpudo -->
  <rect x="214" y="301" width="52" height="7" rx="2" fill="#d9572b"/>

  <!-- Calabazas -->
  <g stroke="#9a3f00" stroke-width="2.5">
    <ellipse cx="142" cy="312" rx="26" ry="20" fill="#f28c1d"/>
    <path d="M132 294 q-6 18 0 36 M152 294 q6 18 0 36" fill="none"/>
    <ellipse cx="342" cy="318" rx="18" ry="14" fill="#f28c1d"/>
  </g>
  <path d="M140 292 q2 -8 8 -10" stroke="#3f6b22" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M341 304 q1 -6 6 -8" stroke="#3f6b22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Cara de la calabaza grande -->
  <g fill="#ffd76a" stroke="#7a2f00" stroke-width="1">
    <path d="M128 305 l6 -7 l6 7 z"/><path d="M144 305 l6 -7 l6 7 z"/>
    <path d="M126 316 q16 12 32 0 l-4 1 l-3 4 l-4 -3 l-5 3 l-4 -3 l-4 3 l-3 -4 z"/>
  </g>
</svg>
